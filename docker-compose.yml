# =============================================================================
# Sightline — Docker Compose (production + local dev)
# =============================================================================
# Usage:
#   docker compose up -d          # Start app + Caddy
#   docker compose up --build      # Rebuild image
#   docker compose logs -f app    # Follow app logs
#   docker compose exec app pytest tests/  # Run tests
#   docker compose down            # Stop everything
#
# WITHOUT Firebase (local/desktop mode):
#   1. Set DESKTOP_MODE=true in .env
#   2. Create an empty placeholder so Docker doesn't create a directory:
#      touch firebase-service-account.json
#   3. docker compose up -d --build
#   → Auth is bypassed, all requests get a mock admin user.

services:
  app:
    build: .
    image: ghcr.io/serkankzlrmk/sightline:latest
    container_name: sightline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override paths for container (volumes are directories, not single files)
      DB_PATH: /app/data/reliefweb.db
      CHATS_DB_PATH: /app/data/chats.db
      CHROMA_DIR: /app/reliefweb_chroma
      DOWNLOADS_DIR: /app/reliefweb_downloads
      # DESKTOP_MODE: bypass Firebase auth for local desktop use.
      # Set to true for local use without Firebase. Default: false (Firebase active).
      DESKTOP_MODE: ${DESKTOP_MODE:-false}
      # Firebase service account path (env-driven)
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - reliefweb_db:/app/data
      - chroma_data:/app/reliefweb_chroma
      - output_data:/app/output
      - mcp_cache:/tmp/uv-cache
      - npm_cache:/tmp/npm-cache
      # Mount Firebase service account JSON.
      # For production with Firebase auth: place your file at ./firebase-service-account.json
      # For local use without Firebase: set DESKTOP_MODE=true and create a placeholder:
      #   touch firebase-service-account.json
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Mount frontend assets so design changes persist across recreates
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: sightline-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Daily previous-day ReliefWeb ingestion. This service is intentionally
  # separate from the request worker and never sits on the user request path.
  daily-ingest:
    build: .
    image: ghcr.io/serkankzlrmk/sightline:latest
    container_name: sightline-daily-ingest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/reliefweb.db
      CHATS_DB_PATH: /app/data/chats.db
      CHROMA_DIR: /app/reliefweb_chroma
      DOWNLOADS_DIR: /app/reliefweb_downloads
      DESKTOP_MODE: "false"
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - reliefweb_db:/app/data
      - chroma_data:/app/reliefweb_chroma
      - output_data:/app/output
      - mcp_cache:/tmp/uv-cache
      - npm_cache:/tmp/npm-cache
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./scripts:/app/scripts:ro
    command: ["sh", "/app/scripts/daily_scheduler.sh"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  reliefweb_db:
  chroma_data:
  output_data:
  mcp_cache:
  npm_cache:
  caddy_data:
  caddy_config: