# =============================================================================
# Sightline + Proposal Studio — Docker Compose (production + local dev)
# =============================================================================
# Usage:
#   docker compose up -d          # Start app + proposal + Caddy
#   docker compose up --build      # Rebuild images
#   docker compose logs -f app    # Follow Sightline logs
#   docker compose logs -f proposal # Follow Proposal Studio logs
#
# WITHOUT Firebase (local/desktop mode):
#   1. Set DESKTOP_MODE=true in .env
#   2. Create an empty placeholder so Docker doesn't create a directory:
#      touch firebase-service-account.json
#   3. docker compose up -d --build
#   → Auth is bypassed, all requests get a mock admin user.

services:
  # ── Sightline (main platform) ─────────────────────────────────────────────
  app:
    build: ./sightline
    image: ghcr.io/serkankzlrmk/sightline:latest
    container_name: sightline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override paths for container (volumes are directories, not single files)
      DB_PATH: /app/data/reliefweb.db
      CHATS_DB_PATH: /app/data/chats.db
      CHROMA_DIR: /app/reliefweb_chroma
      DOWNLOADS_DIR: /app/reliefweb_downloads
      # DESKTOP_MODE: bypass Firebase auth for local desktop use.
      # Set to true for local use without Firebase. Default: false (Firebase active).
      DESKTOP_MODE: ${DESKTOP_MODE:-false}
      # Firebase service account path (env-driven)
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - reliefweb_db:/app/data
      - chroma_data:/app/reliefweb_chroma
      - output_data:/app/output
      - mcp_cache:/tmp/uv-cache
      - npm_cache:/tmp/npm-cache
      # Mount Firebase service account JSON.
      # For production with Firebase auth: place your file at ./firebase-service-account.json
      # For local use without Firebase: set DESKTOP_MODE=true and create a placeholder:
      #   touch firebase-service-account.json
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Mount frontend assets so design changes persist across recreates
      - ./sightline/static:/app/static:ro
      - ./sightline/templates:/app/templates:ro
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Proposal Studio (grant writing workspace) ─────────────────────────────
  proposal:
    build: ./proposal
    image: ghcr.io/serkankzlrmk/proposal-studio:latest
    container_name: proposal-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROPOSAL_PORT: "5002"
      PROPOSAL_HOST: "0.0.0.0"
      PROPOSAL_BASE_PATH: "/proposal"
      PROPOSAL_DEBUG: "false"
      DB_PATH: /app/data/proposal.db
      OUTPUT_DIR: /app/output
      # Sightline evidence bridge: mount Sightline code read-only for ReliefWeb/HDX imports
      SIGHTLINE_ROOT: /app/sightline
    volumes:
      - proposal_db:/app/data
      - proposal_output:/app/output
      # Read-only Sightline mount for evidence bridge (reliefweb_api imports)
      - ./:/app/sightline:ro
      # Firebase service account for auth (same project as Sightline)
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

  # ── Caddy reverse proxy (path-based routing) ─────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: sightline-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # ── Daily ReliefWeb ingestion ─────────────────────────────────────────────
  daily-ingest:
    build: ./sightline
    image: ghcr.io/serkankzlrmk/sightline:latest
    container_name: sightline-daily-ingest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/reliefweb.db
      CHATS_DB_PATH: /app/data/chats.db
      CHROMA_DIR: /app/reliefweb_chroma
      DOWNLOADS_DIR: /app/reliefweb_downloads
      DESKTOP_MODE: "false"
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - reliefweb_db:/app/data
      - chroma_data:/app/reliefweb_chroma
      - output_data:/app/output
      - mcp_cache:/tmp/uv-cache
      - npm_cache:/tmp/npm-cache
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./sightline/scripts:/app/scripts:ro
    command: ["sh", "/app/scripts/daily_scheduler.sh"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  reliefweb_db:
    external: true
    name: reliefweb_db
  chroma_data:
    external: true
    name: chroma_data
  output_data:
    external: true
    name: output_data
  mcp_cache:
    external: true
    name: mcp_cache
  npm_cache:
    external: true
    name: npm_cache
  proposal_db:
    external: true
    name: proposal_db
  proposal_output:
    external: true
    name: proposal_output
  caddy_data:
    external: true
    name: caddy_data
  caddy_config:
    external: true
    name: caddy_config