services:
  app:
    environment:
      DESKTOP_MODE: "true"
    volumes:
      - ./reliefweb.db:/app/data/reliefweb.db
      - ./chats.db:/app/data/chats.db
      - ./reliefweb_chroma:/app/reliefweb_chroma
      - ./output:/app/output
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
