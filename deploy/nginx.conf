server {
    # ReliefAgent Data Platform — Nginx Reverse Proxy
    #
    # Replace YOUR_SERVER_IP with your server's public IP address.
    # If you have a domain, replace it in server_name.
    #
    # For HTTPS, run: sudo certbot --nginx -d yourdomain.com

    listen 80;
    server_name YOUR_SERVER_IP;

    # Max upload size (50MB — must match Flask MAX_CONTENT_LENGTH)
    client_max_body_size 50M;

    # Security headers (supplement Flask's after_request)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for agent chat + SITREP stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support (future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files — serve directly for performance
    location /static/ {
        proxy_pass http://127.0.0.1:5001/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # Static files don't need SSE/websocket
        proxy_buffering on;
        proxy_read_timeout 30s;
    }

    # Health check — no auth needed
    location /api/health {
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}