# Rate limiting zones (defense-in-depth with Flask's per-IP limiter)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sse:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    # Sightline Data Platform — Nginx Reverse Proxy
    #
    # Replace YOUR_SERVER_IP with your server's public IP address.
    # If you have a domain, replace it in server_name.
    #
    # For HTTPS, run: sudo certbot --nginx -d yourdomain.com

    listen 80;
    server_name sightline.duckdns.org YOUR_SERVER_IP;

    # Default body limit for all routes (upload endpoint overrides below)
    client_max_body_size 1m;

    # Per-IP connection limit (defense-in-depth)
    limit_conn connperip 20;

    # Security headers (supplement Flask's after_request)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SSE endpoints — stricter rate limit, no buffering
    location ~ ^/api/(agent/chat|sitrep/stream) {
        limit_req zone=sse burst=5 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # File upload — larger body limit only for upload endpoint
    location /api/ingest/upload {
        client_max_body_size 50M;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files — serve directly for performance
    # Short cache + must-revalidate to ensure updates are picked up quickly
    location /static/ {
        proxy_pass http://127.0.0.1:5001/static/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";

        # Static files don't need SSE/websocket
        proxy_buffering on;
        proxy_read_timeout 30s;
    }

    # Health check — no auth needed
    location /api/health {
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}