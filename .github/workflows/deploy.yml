name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_timeout: 300s
          script: |
            echo "=== Deploy triggered by GitHub Actions ==="
            echo "  Commit: ${{ github.sha }}"
            echo "  Branch: ${{ github.ref }}"
            echo "  Actor:  ${{ github.actor }}"
            echo ""

            # Run the safe deploy script (atomic symlink + auto-rollback)
            sudo bash /opt/reliefagent/current/deploy/deploy.sh main

      - name: Verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_timeout: 30s
          script: |
            HEALTH=$(curl -sf http://127.0.0.1:5001/api/health 2>/dev/null || echo '{"status":"failed"}')
            echo "Health check: $HEALTH"
            echo "$HEALTH" | grep -q '"ok"' && echo "✓ Deploy successful!" || echo "✗ Health check failed!"