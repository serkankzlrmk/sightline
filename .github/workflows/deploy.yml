name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: serkankzlrmk/redagent

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      DEV_AUTH_BYPASS: "true"
      SERVER_DEBUG: "true"
      SERVER_HOST: "127.0.0.1"
      OLLAMA_BASE_URL: "http://localhost:11434/v1"
      LLM_PROVIDER: "openrouter"
      OPENROUTER_API_KEY: "test-key"
      ACTIVE_MODEL: "test-model"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      - run: pytest tests/ -v --tb=short -x
        timeout-minutes: 10

  # ── Job 2: Build & Push Docker image ─────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to production ─────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_timeout: 120s
          script: |
            set -e

            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Save current image tag for rollback
            PREV_TAG=$(docker inspect sightline --format='{{.Config.Image}}' 2>/dev/null || echo "")

            # Stop old container
            docker stop sightline 2>/dev/null || true
            docker rm sightline 2>/dev/null || true

            # Start new container
            docker run -d --name sightline \
              --env-file /opt/reliefagent/data/.env \
              -e DB_PATH=/app/data/reliefweb.db \
              -e CHATS_DB_PATH=/app/data/chats.db \
              -e CHROMA_DIR=/app/reliefweb_chroma \
              -e CONTAINER_MODE=true \
              -v reliefweb_db:/app/data \
              -v chroma_data:/app/reliefweb_chroma \
              -v output_data:/app/output \
              -v mcp_cache:/tmp/uv-cache \
              -v npm_cache:/tmp/npm-cache \
              -v /opt/reliefagent/data/firebase-service-account.json:/app/firebase-service-account.json:ro \
              --restart unless-stopped \
              -p 127.0.0.1:5001:5001 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Health check (up to 10 retries, 3s apart)
            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:5001/api/health 2>/dev/null | grep -q '"ok"'; then
                echo "Deploy OK: health check passed (attempt $i)"
                exit 0
              fi
              [ "$i" = "10" ] && {
                echo "Health check failed — rolling back"
                docker stop sightline 2>/dev/null || true
                docker rm sightline 2>/dev/null || true
                if [ -n "$PREV_TAG" ]; then
                  docker run -d --name sightline \
                    --env-file /opt/reliefagent/data/.env \
                    -e DB_PATH=/app/data/reliefweb.db \
                    -e CHATS_DB_PATH=/app/data/chats.db \
                    -e CHROMA_DIR=/app/reliefweb_chroma \
                    -e CONTAINER_MODE=true \
                    -v reliefweb_db:/app/data \
                    -v chroma_data:/app/reliefweb_chroma \
                    -v output_data:/app/output \
                    -v mcp_cache:/tmp/uv-cache \
                    -v npm_cache:/tmp/npm-cache \
                    -v /opt/reliefagent/data/firebase-service-account.json:/app/firebase-service-account.json:ro \
                    --restart unless-stopped \
                    -p 127.0.0.1:5001:5001 \
                    "$PREV_TAG"
                  echo "Rollback to $PREV_TAG complete"
                fi
                exit 1
              }
              sleep 3
            done