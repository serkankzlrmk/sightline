name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      # NOTE: DESKTOP_MODE intentionally NOT set here. Tests patch
      # DEV_AUTH_BYPASS/SERVER_DEBUG themselves; a global DESKTOP_MODE=true
      # makes auth._dev_mode() always return True and breaks the dev-mode
      # safety tests (pre-existing CI breakage, fixed 2026-08-23).
      SERVER_HOST: "127.0.0.1"
      SERVER_DEBUG: "true"
      DEV_AUTH_BYPASS: "true"
      OLLAMA_BASE_URL: "http://localhost:11434/v1"
      LLM_PROVIDER: "openrouter"
      OPENROUTER_API_KEY: "test-key"
      ACTIVE_MODEL: "test-model"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --tb=short
        timeout-minutes: 10

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for secrets in git history
        run: |
          # Check for real secrets — Firebase web API keys (AIza...) are
          # intentionally public and NOT secrets; they are safe to commit.
          if git log --all -p | grep -qE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})"; then
            echo "⚠️ Potential secret found in git history!"
            git log --all -p | grep -nE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})" | head -5
            exit 1
          else
            echo "✅ No secrets found in git history"
          fi