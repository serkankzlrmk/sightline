name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      DESKTOP_MODE: "true"
      SERVER_HOST: "127.0.0.1"
      SERVER_DEBUG: "true"
      OLLAMA_BASE_URL: "http://localhost:11434/v1"
      LLM_PROVIDER: "openrouter"
      OPENROUTER_API_KEY: "test-key"
      ACTIVE_MODEL: "test-model"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --tb=short
        timeout-minutes: 10

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for secrets in git history
        run: |
          if git log --all -p | grep -qE "(sk-[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{35}|ghp_[a-zA-Z0-9]{36})"; then
            echo "⚠️ Potential API key found in git history!"
            git log --all -p | grep -nE "(sk-[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{35}|ghp_[a-zA-Z0-9]{36})" | head -5
            exit 1
          else
            echo "✅ No API keys found in git history"
          fi
