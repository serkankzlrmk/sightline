name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[FEAT] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's currently difficult or impossible?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Be as specific as possible.
      placeholder: "Sightline should..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives have you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent (chat / tools)
        - SITREP pipeline
        - Guided Proposal
        - Dashboard / UI
        - Country Intelligence
        - Auth / RBAC
        - MCP integration
        - API
        - Deployment / DevOps
        - Other
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: Willing to contribute?
      options:
        - label: I'm willing to submit a PR for this feature
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting, you agree to follow our [Code of Conduct](../CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
